<!DOCTYPE html>
<html lang="tr" class="light scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detayı | Özen Oto Kumluca</title>
    <meta name="robots" content="index, follow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="urunler.js?v=8.0"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { yellow: '#FFB800', dark: '#0D0D0D', cardDark: '#161616' } } } }
        }
    </script>
    
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        .kutu-golge { box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .cam-efekt { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-brand-dark text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col justify-between antialiased selection:bg-yellow-500 selection:text-black">

    <!-- UYARI BANTI -->
    <div class="bg-gradient-to-r from-red-700 via-red-600 to-red-700 text-white text-xs md:text-sm font-black py-2.5 px-4 text-center border-b border-red-800 tracking-wide uppercase shadow-md flex items-center justify-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-yellow-300 text-base"></i>
        <span>ÖNEMLİ UYARI: Orijinal MAİS logolu ürünlerin paket açılımı sonrası kesinlikle iadesi yoktur!</span>
    </div>

    <!-- HEADER -->
    <header class="bg-white/90 dark:bg-brand-dark/90 cam-efekt py-4 kutu-golge border-b dark:border-gray-800/80 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3">
                <div class="flex flex-col">
                    <span class="text-2xl font-black text-gray-900 dark:text-white tracking-tight">ÖZEN OTO</span>
                    <span class="text-[9px] font-black text-red-600 tracking-widest uppercase">RENAULT & DACIA YEDEK PARÇA</span>
                </div>
            </a>
            
            <a href="index.html" class="bg-yellow-500 hover:bg-yellow-600 text-black font-black px-4 py-2.5 rounded-xl text-xs uppercase flex items-center gap-2 transition-all">
                <i class="fa-solid fa-arrow-left"></i> Kataloğa Dön
            </a>
        </div>
    </header>

    <!-- KAPSAYICI İÇERİK -->
    <main class="container mx-auto px-4 py-10 flex-1 flex items-center justify-center">
        <div id="urun-detay-kapsayici" class="w-full max-w-4xl">
            <!-- JavaScript ile dinamik dolacak -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-950 text-gray-400 py-6 text-center text-xs border-t-2 border-yellow-500">
        <p class="font-bold text-gray-300">&copy; 2026 Özen Oto Yedek Parça - Kumluca / Antalya</p>
    </footer>

    <!-- TOAST BİLDİRİM -->
    <div id="toast-bildirim" class="fixed bottom-10 right-6 z-[100] bg-gray-900 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-2xl border border-yellow-500 hidden">
        <span id="toast-mesaj">Kopyalandı!</span>
    </div>

    <script>
        // VARSAYILAN YEDEK LOGO ŞABLONU (RENAULT & DACIA)
        const varsayilanLogoDetay = `
            <div class="flex items-center justify-center gap-4 w-full h-full min-h-[280px] bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-900 dark:to-gray-800 p-8 rounded-2xl select-none">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Renault_2021.svg" alt="Renault" class="h-16 w-auto object-contain drop-shadow">
                <span class="h-12 border-r-2 border-gray-300 dark:border-gray-700"></span>
                <img src="https://1000logos.net/wp-content/uploads/2021/10/Dacia-logo.jpg" alt="Dacia" class="h-12 w-auto object-contain rounded shadow-sm">
            </div>
        `;

        function resimYolu(resim) {
            if (!resim || resim.trim() === '') return '';
            if (resim.startsWith('http://') || resim.startsWith('https://') || resim.startsWith('data:')) {
                return resim;
            }
            return 'gorseller/' + resim;
        }

        function toastGoster(mesaj) {
            const toast = document.getElementById('toast-bildirim');
            document.getElementById('toast-mesaj').innerText = mesaj;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        function logoDetayGoster(imgElement) {
            imgElement.outerHTML = varsayilanLogoDetay;
        }

        function sepeteEkle(urunId) {
            const tumUrunler = window.urunler || [];
            const urun = tumUrunler.find(u => u.id === urunId);
            if (!urun) return;

            let sepet = JSON.parse(localStorage.getItem('ozen_sepet')) || [];
            const varOlan = sepet.find(item => item.id === urunId);
            if (varOlan) {
                varOlan.adet += 1;
            } else {
                sepet.push({
                    id: urun.id,
                    baslik: urun.baslik,
                    oem: urun.oem,
                    arac: urun.arac,
                    resim: urun.resim,
                    adet: 1
                });
            }
            localStorage.setItem('ozen_sepet', JSON.stringify(sepet));
            toastGoster(`${urun.baslik.substring(0, 25)}... sepete eklendi!`);
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const urunId = params.get('id');
            const tumUrunler = window.urunler || [];
            const kapsayici = document.getElementById('urun-detay-kapsayici');

            const urun = tumUrunler.find(u => u.id === urunId);

            if (!urun) {
                kapsayici.innerHTML = `
                    <div class="bg-white dark:bg-brand-cardDark border border-gray-200 dark:border-gray-800 rounded-3xl p-10 text-center kutu-golge">
                        <i class="fa-solid fa-triangle-exclamation text-5xl text-yellow-500 mb-4"></i>
                        <h2 class="text-xl font-black text-gray-900 dark:text-white uppercase mb-2">Aradığınız Ürün Bulunamadı</h2>
                        <p class="text-xs text-gray-500 mb-6">Aradığınız parça bulunamadı veya bağlantı hatalı olabilir.</p>
                        <a href="index.html" class="inline-flex items-center gap-2 bg-yellow-500 hover:bg-yellow-600 text-black font-black px-6 py-3 rounded-xl text-xs uppercase shadow">
                            <i class="fa-solid fa-house"></i> Ana Sayfaya Dön
                        </a>
                    </div>
                `;
                return;
            }

            document.title = `${urun.baslik} - ${urun.oem} | Özen Oto`;

            const gorselUrl = resimYolu(urun.resim);
            const etiketMetni = urun.marka || urun.etiket || 'ORİJİNAL MAİS';
            const waMsg = encodeURIComponent(`Merhaba, ${urun.baslik} (OEM: ${urun.oem}) parçası stokta var mı? Fiyat alabilir miyim?`);

            kapsayici.innerHTML = `
                <div class="bg-white dark:bg-brand-cardDark border border-gray-200 dark:border-gray-800 rounded-3xl p-6 md:p-8 kutu-golge grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                    
                    <div class="relative bg-gray-50 dark:bg-gray-900/80 rounded-2xl border border-gray-100 dark:border-gray-800 p-4 flex items-center justify-center min-h-[280px] overflow-hidden">
                        <span class="absolute top-4 left-4 bg-yellow-500 text-black text-[11px] font-black px-3 py-1 rounded-lg uppercase z-10 shadow-sm">${etiketMetni}</span>
                        ${gorselUrl ? `
                            <img src="${gorselUrl}" alt="${urun.baslik}" referrerpolicy="no-referrer" onerror="logoDetayGoster(this)" class="w-full h-auto max-h-[320px] object-contain rounded-xl">
                        ` : varsayilanLogoDetay}
                    </div>

                    <div class="flex flex-col justify-between space-y-5">
                        <div>
                            <span class="text-xs font-black text-red-600 dark:text-red-400 uppercase tracking-widest block mb-1.5">${urun.arac || 'Renault & Dacia Uyumlu'}</span>
                            <h1 class="text-xl md:text-2xl font-black text-gray-900 dark:text-white uppercase leading-snug">${urun.baslik}</h1>
                        </div>

                        <div class="bg-gray-50 dark:bg-gray-900/90 border border-gray-200 dark:border-gray-800/80 rounded-2xl p-4 space-y-2 text-xs">
                            <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-800 pb-2">
                                <span class="text-gray-500 dark:text-gray-400 font-bold">OEM Parça Kodu:</span>
                                <div class="flex items-center gap-2">
                                    <strong class="font-mono font-black text-sm text-gray-900 dark:text-white">${urun.oem}</strong>
                                    <button onclick="navigator.clipboard.writeText('${urun.oem}'); toastGoster('OEM Kodu Kopyalandı!');" title="Kopyala" class="text-yellow-600 hover:text-yellow-500 p-1">
                                        <i class="fa-regular fa-copy"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between pt-1">
                                <span class="text-gray-500 dark:text-gray-400 font-bold">Uyumlu Araç Grubu:</span>
                                <span class="font-bold text-gray-800 dark:text-gray-200">${urun.arac || 'Genel Parça'}</span>
                            </div>
                        </div>

                        <div class="space-y-3 pt-2">
                            <button onclick="sepeteEkle('${urun.id}')" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-4 rounded-xl text-xs uppercase flex items-center justify-center gap-2 shadow-md transition-all active:scale-98">
                                <i class="fa-solid fa-cart-plus text-base"></i> SEPETE EKLE
                            </button>

                            <a href="https://wa.me/905327249417?text=${waMsg}" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-xl text-xs uppercase flex items-center justify-center gap-2 shadow-md transition-all active:scale-98">
                                <i class="fa-brands fa-whatsapp text-lg"></i> WHATSAPP'TAN FİYAT & STOK SOR
                            </a>
                        </div>
                    </div>

                </div>
            `;
        };
    </script>
</body>
</html>
