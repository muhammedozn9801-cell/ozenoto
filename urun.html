<!DOCTYPE html>
<html lang="tr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yedek Parça Detayı | Özen Oto Kumluca</title>
    <meta name="description" content="Renault ve Dacia orijinal MAİS yedek parça detayları, OEM kodları ve WhatsApp stok sorgulama. Özen Oto Kumluca Antalya.">
    <meta name="robots" content="index, follow">

    <!-- HIZLANDIRMA: DIŞ SUNUCULARA ÖN BAĞLANTI -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- KOYU MOD HAFIZA KONTROLÜ -->
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- ÜRÜN VERİTABANI BAĞLANTISI -->
    <script src="urunler.js?v=2.0"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { yellow: '#FFB800', dark: '#111111' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-brand-dark text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- HEADER -->
    <header class="bg-white dark:bg-gray-900 py-4 shadow border-b dark:border-gray-800">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex flex-col">
                <span class="text-2xl font-black text-black dark:text-white">ÖZEN OTO</span>
                <span class="text-[10px] font-bold text-red-600 tracking-widest">RENAULT & DACIA YEDEK PARÇA</span>
            </a>
            <div class="flex items-center gap-3">
                <button onclick="temaDegistir()" class="p-2.5 rounded-lg border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-yellow-400 font-bold text-sm flex items-center gap-2 transition-all active:scale-95">
                    <i id="tema-ikonu" class="fa-solid fa-moon"></i>
                    <span id="tema-yazi" class="hidden sm:inline">Koyu Mod</span>
                </button>
                <a href="index.html" class="text-xs font-extrabold text-gray-700 dark:text-gray-300 hover:text-yellow-500 flex items-center gap-1 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön
                </a>
            </div>
        </div>
    </header>

    <!-- ÜRÜN DETAY ALANI -->
    <main class="container mx-auto px-4 py-10 max-w-4xl flex-1">
        <div id="urun-detay-kutu" class="bg-white dark:bg-gray-800 p-6 md:p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 py-4 text-center text-xs border-t-2 border-yellow-500">
        <p>&copy; 2026 Özen Oto Yedek Parça - Kumluca / Antalya</p>
    </footer>

    <!-- TOAST BİLDİRİM KUTUSU -->
    <div id="toast-bildirim" class="fixed bottom-10 right-6 z-[100] bg-gray-900 text-white text-xs font-bold px-4 py-3 rounded-lg shadow-2xl border border-yellow-500 hidden">
        <span id="toast-mesaj">Kopyalandı!</span>
    </div>

    <script>
        function temaButonunuGuncelle() {
            const isDark = document.documentElement.classList.contains('dark');
            const ikonav = document.getElementById('tema-ikonu');
            const yazi = document.getElementById('tema-yazi');
            if (ikonav) ikonav.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
            if (yazi) yazi.textContent = isDark ? "Açık Mod" : "Koyu Mod";
        }

        function temaDegistir() {
            const htmlTag = document.documentElement;
            if (htmlTag.classList.contains('dark')) {
                htmlTag.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlTag.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            temaButonunuGuncelle();
        }

        function toastGoster(mesaj) {
            const toast = document.getElementById('toast-bildirim');
            document.getElementById('toast-mesaj').innerText = mesaj;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        window.onload = function() {
            temaButonunuGuncelle();
            
            const urlParams = new URLSearchParams(window.location.search);
            const urunId = urlParams.get('id');
            const kutu = document.getElementById('urun-detay-kutu');
            const tumUrunler = window.urunler || [];

            if (tumUrunler.length > 0 && urunId) {
                const urun = tumUrunler.find(u => u.id === urunId);
                if (urun) {
                    document.title = `${urun.baslik} | Özen Oto Yedek Parça`;
                    const waMesaj = encodeURIComponent(`Merhaba, ${urun.baslik} (OEM: ${urun.oem}) parçası stokta var mı? Fiyat alabilir miyim?`);
                    kutu.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                            <div class="bg-gray-100 dark:bg-gray-900 h-72 rounded-lg flex items-center justify-center overflow-hidden border border-gray-200 dark:border-gray-700 shadow-inner group">
                                ${urun.resim ? `<img src="${urun.resim}" alt="${urun.baslik}" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">` : `<i class="fa-solid fa-gears text-6xl text-gray-400"></i>`}
                            </div>
                            <div>
                                <span class="bg-yellow-500 text-black text-xs font-black px-3 py-1 rounded uppercase inline-block mb-3 shadow-sm">${urun.etiket}</span>
                                <h1 class="text-2xl font-black mb-4 text-gray-900 dark:text-white leading-tight">${urun.baslik}</h1>
                                
                                <div class="space-y-3 mb-6 bg-gray-50 dark:bg-gray-900/50 p-4 rounded-lg border border-gray-200 dark:border-gray-700 text-sm">
                                    <p class="text-gray-600 dark:text-gray-300"><strong>Uyumlu Araçlar:</strong> <span class="text-gray-900 dark:text-white font-semibold">${urun.arac}</span></p>
                                    <div class="flex items-center justify-between border-t border-gray-200 dark:border-gray-700 pt-2">
                                        <p class="text-gray-600 dark:text-gray-300"><strong>OEM Kodu:</strong> <span class="text-red-600 font-mono font-bold">${urun.oem}</span></p>
                                        <button onclick="navigator.clipboard.writeText('${urun.oem}'); toastGoster('OEM Kodu Kopyalandı!');" class="bg-gray-200 dark:bg-gray-700 hover:bg-yellow-500 hover:text-black px-2.5 py-1 rounded text-xs font-bold transition-all flex items-center gap-1">
                                            <i class="fa-regular fa-copy"></i> Kopyala
                                        </button>
                                    </div>
                                </div>
                                
                                <div class="bg-red-50 dark:bg-red-950/40 border-l-4 border-red-600 p-3 rounded mb-6 text-xs text-red-700 dark:text-red-300 font-semibold">
                                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Orijinal MAİS logolu ürünlerde kesinlikle iade kabul edilmemektedir.
                                </div>

                                <a href="https://wa.me/905327249417?text=${waMesaj}" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 px-4 rounded-lg text-center flex items-center justify-center gap-2 uppercase tracking-wide transition-all shadow-md hover:shadow-green-600/30 active:scale-95">
                                    <i class="fa-brands fa-whatsapp text-2xl"></i> WhatsApp ile Fiyat & Stok Sorgula
                                </a>
                            </div>
                        </div>
                    `;
                    return;
                }
            }
            kutu.innerHTML = `
                <div class="text-center py-12">
                    <i class="fa-solid fa-box-open text-5xl text-gray-400 mb-4"></i>
                    <p class="text-lg font-bold text-gray-700 dark:text-gray-300">Ürün bulunamadı veya geçersiz ID.</p>
                    <a href="index.html" class="inline-block mt-4 bg-yellow-500 text-black font-bold py-2 px-6 rounded text-sm hover:bg-yellow-600 transition-colors">Ana Sayfaya Dön</a>
                </div>
            `;
        };
    </script>
</body>
</html>
