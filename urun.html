<!DOCTYPE html>
<html lang="tr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Detayı | Özen Oto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="urunler.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { yellow: '#FFB800', dark: '#111111' } } } } }
    </script>
</head>
<body class="bg-gray-100 dark:bg-brand-dark text-gray-900 dark:text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-white dark:bg-gray-900 py-4 shadow border-b dark:border-gray-800">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex flex-col">
                <span class="text-2xl font-black text-black dark:text-white">ÖZEN OTO</span>
                <span class="text-[10px] font-bold text-red-600 tracking-widest">RENAULT & DACIA YEDEK PARÇA</span>
            </a>
            <a href="index.html" class="text-xs font-bold text-gray-600 dark:text-gray-300 hover:text-yellow-500 flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön
            </a>
        </div>
    </header>

    <!-- ÜRÜN DETAY ALANI -->
    <main class="container mx-auto px-4 py-8 max-w-4xl flex-1">
        <div id="urun-detay-kutu" class="bg-white dark:bg-gray-800 p-6 rounded shadow border border-gray-200 dark:border-gray-700">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 py-4 text-center text-xs border-t-2 border-yellow-500">
        <p>&copy; 2026 Özen Oto Yedek Parça - Kumluca / Antalya</p>
    </footer>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const urunId = urlParams.get('id');
            const kutu = document.getElementById('urun-detay-kutu');

            if (typeof urunler !== 'undefined' && urunId) {
                const urun = urunler.find(u => u.id === urunId);
                if (urun) {
                    const waMesaj = encodeURIComponent(`Merhaba, ${urun.baslik} (OEM: ${urun.oem}) parçası hakkında bilgi almak istiyorum.`);
                    kutu.innerHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                            <div class="bg-gray-100 dark:bg-gray-900 h-64 rounded flex items-center justify-center overflow-hidden border">
                                ${urun.resim ? `<img src="${urun.resim}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-gears text-6xl text-gray-400"></i>`}
                            </div>
                            <div>
                                <span class="bg-yellow-500 text-black text-xs font-black px-2 py-1 rounded uppercase inline-block mb-2">${urun.etiket}</span>
                                <h1 class="text-xl font-bold mb-2">${urun.baslik}</h1>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mb-1"><strong>Uyumlu Araçlar:</strong> ${urun.arac}</p>
                                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4"><strong>OEM Kod:</strong> <span class="text-red-600 font-bold">${urun.oem}</span></p>
                                
                                <div class="bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 p-3 rounded mb-4 text-xs text-red-700 dark:text-red-300">
                                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Orijinal MAİS logolu ürünlerde iade yapılmamaktadır.
                                </div>

                                <a href="https://wa.me/905327249417?text=${waMesaj}" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded text-center flex items-center justify-center gap-2">
                                    <i class="fa-brands fa-whatsapp text-xl"></i> WhatsApp ile Fiyat & Stok Sorgula
                                </a>
                            </div>
                        </div>
                    `;
                    return;
                }
            }
            kutu.innerHTML = `<p class="text-center text-gray-500 py-8">Ürün bulunamadı veya geçersiz ID.</p>`;
        };
    </script>
</body>
</html>
