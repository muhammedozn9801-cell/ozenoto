<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yedek Parça Arama</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkon Seti -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-200">

    <!-- HEADER / ARAMA BÖLÜMÜ -->
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 p-4 sticky top-0 z-[100]">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="#" class="text-xl font-black text-yellow-500 flex items-center gap-2">
                <i class="fa-solid fa-car-side text-2xl"></i> OTO YEDEK PARÇA
            </a>

            <!-- ARAMA KUTUSU -->
            <div class="flex-1 w-full max-w-xl relative">
                <div class="flex border-2 border-yellow-500 rounded-lg overflow-hidden bg-white dark:bg-gray-800 shadow-sm focus-within:ring-2 focus-within:ring-yellow-400 transition-all">
                    <input type="text" id="arama-girdisi" oninput="canliAramaYap()" onkeypress="if(event.key === 'Enter') aramaModalAc()" placeholder="Parça adı veya OEM koda göre arayın... (Örn: 8200, Triger, Buji)" class="w-full px-4 py-2.5 text-sm outline-none dark:bg-gray-800 dark:text-white">
                    <button onclick="aramaModalAc()" class="bg-yellow-500 hover:bg-yellow-600 text-black px-6 font-black uppercase text-xs tracking-wider transition-colors flex items-center gap-1.5 flex-shrink-0">
                        <i class="fa-solid fa-magnifying-glass"></i> ARA
                    </button>
                </div>

                <!-- Canlı Arama Açılır Kutu (Dropdown) -->
                <div id="arama-sonuclari" class="absolute left-0 right-0 top-full mt-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-2xl hidden max-h-80 overflow-y-auto z-[200]"></div>
            </div>
        </div>
    </header>

    <!-- ARAMA SONUÇLARI LİSTE MODALI (AÇILIR PENCERE) -->
    <div id="arama-liste-modal" class="fixed inset-0 z-[110] bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 border-t-4 border-yellow-500 w-full max-w-3xl max-h-[85vh] p-6 rounded-2xl shadow-2xl flex flex-col relative">
            
            <!-- Kapatma Butonu -->
            <button onclick="aramaModalKapat()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-xl font-bold transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Modal Başlığı -->
            <div class="border-b dark:border-gray-700 pb-3 mb-4">
                <h3 class="text-xl font-black text-gray-900 dark:text-white uppercase flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-yellow-500"></i> Arama Sonuçları
                </h3>
                <p id="arama-modal-ozet" class="text-xs text-gray-500 dark:text-gray-400 mt-1">Arama teriminize uygun parçalar listeleniyor...</p>
            </div>

            <!-- Liste İçeriği (Kaydırılabilir Alan) -->
            <div id="arama-modal-liste" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- JavaScript burayı dinamik dolduracak -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT KODLARI -->
    <script>
        // Ürün Listeniz (Ayrı urunler.js dosyanız varsa bu array oradan gelecektir)
        window.urunler = window.urunler || [
            {
                id: "renault-termostat-110606181r",
                baslik: "Renault Megane 4 1.5 dCi Termostat Gövdesi Komple",
                oem: "110606181R",
                resim: "https://www.akbayoto.com/images/products/110606181R.jpg",
                arac: "Megane 4 / Kadjar",
                kategori: "motor"
            },
            {
                id: "renault-triger-set-8201059902",
                baslik: "Renault Clio 4 1.5 dCi Triger Seti Devridaimli",
                oem: "8201059902",
                resim: "triger-seti.jpg",
                arac: "Clio 4 / Megane 3",
                kategori: "motor"
            }
        ];

        // Türkçe karakter aramasını kolaylaştıran normalize fonksiyonu
        function turkceNormalize(metin) {
            if (!metin) return '';
            return metin.toString()
                .replace(/İ/g, 'i')
                .replace(/I/g, 'ı')
                .toLowerCase()
                .replace(/ç/g, 'c')
                .replace(/ğ/g, 'g')
                .replace(/ı/g, 'i')
                .replace(/ö/g, 'o')
                .replace(/ş/g, 's')
                .replace(/ü/g, 'u')
                .replace(/[^a-z0-9]/g, '');
        }

        // Resim Yolunu Belirleyen Fonksiyon (http ile başlıyorsa direkt link, değilse gorseller/ klasöründen çeker)
        function resimYolu(gorsel) {
            if (!gorsel) return '';
            if (gorsel.startsWith('http://') || gorsel.startsWith('https://')) {
                return gorsel;
            }
            return 'gorseller/' + gorsel;
        }

        // Canlı Arama (Kutunun Altında Anlık Çıkan Ufak Liste)
        function canliAramaYap() {
            const hamGirdi = document.getElementById('arama-girdisi').value.trim();
            const aranan = turkceNormalize(hamGirdi);
            const kutu = document.getElementById('arama-sonuclari');

            if (aranan.length < 2) {
                kutu.classList.add('hidden');
                kutu.innerHTML = '';
                return;
            }

            const eslesenler = window.urunler.filter(u => {
                return turkceNormalize(u.baslik).includes(aranan) ||
                       turkceNormalize(u.oem).includes(aranan) ||
                       turkceNormalize(u.arac).includes(aranan);
            }).slice(0, 5); // İlk 5 sonucu canlıda göster

            if (eslesenler.length > 0) {
                kutu.innerHTML = eslesenler.map(u => `
                    <a href="urun.html?id=${u.id}" class="flex items-center gap-3 p-2.5 hover:bg-gray-100 dark:hover:bg-gray-700 border-b last:border-0 dark:border-gray-700 transition-colors">
                        <div class="w-10 h-10 bg-gray-200 dark:bg-gray-600 rounded flex-shrink-0 flex items-center justify-center overflow-hidden">
                            ${u.resim ? `<img src="${resimYolu(u.resim)}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-gears text-gray-400"></i>`}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h5 class="text-xs font-bold text-gray-800 dark:text-white truncate">${u.baslik}</h5>
                            <p class="text-[10px] text-gray-500 dark:text-gray-400 font-mono">OEM: ${u.oem}</p>
                        </div>
                    </a>
                `).join('');
                kutu.classList.remove('hidden');
            } else {
                kutu.classList.add('hidden');
            }
        }

        // "ARA" Butonuna veya Enter'a Basınca Açılan Tam Liste Penceresi (Modal)
        function aramaModalAc() {
            const hamGirdi = document.getElementById('arama-girdisi').value.trim();
            const aranan = turkceNormalize(hamGirdi);
            const modal = document.getElementById('arama-liste-modal');
            const listeKutusu = document.getElementById('arama-modal-liste');
            const ozetYazi = document.getElementById('arama-modal-ozet');

            if (aranan.length === 0) {
                alert("Lütfen aramak istediğiniz parçanın adını veya OEM kodunu yazın.");
                return;
            }

            // Canlı kopyayı kapat
            document.getElementById('arama-sonuclari').classList.add('hidden');

            const eslesenler = window.urunler.filter(u => {
                const b = turkceNormalize(u.baslik);
                const o = turkceNormalize(u.oem);
                const a = turkceNormalize(u.arac);
                const k = turkceNormalize(u.kategori || '');
                return b.includes(aranan) || o.includes(aranan) || a.includes(aranan) || k.includes(aranan);
            });

            ozetYazi.innerHTML = `<strong>"${hamGirdi}"</strong> araması için <strong>${eslesenler.length}</strong> adet parça bulundu.`;

            if (eslesenler.length > 0) {
                listeKutusu.innerHTML = eslesenler.map(u => {
                    const gorselUrl = resimYolu(u.resim);
                    const waMsg = encodeURIComponent(`Merhaba, ${u.baslik} (OEM: ${u.oem}) parçası stokta var mı?`);
                    return `
                        <div class="flex flex-col sm:flex-row items-center justify-between p-3.5 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl gap-4 hover:border-yellow-500 transition-colors">
                            <div class="flex items-center gap-3.5 w-full sm:w-auto">
                                <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden flex-shrink-0 flex items-center justify-center">
                                    ${gorselUrl ? `<img src="${gorselUrl}" alt="${u.baslik}" loading="lazy" class="w-full h-full object-cover">` : `<i class="fa-solid fa-gears text-2xl text-gray-400"></i>`}
                                </div>
                                <div>
                                    <span class="text-[10px] font-black text-red-600 dark:text-red-400 uppercase tracking-wide">${u.arac}</span>
                                    <h4 class="text-xs sm:text-sm font-bold text-gray-900 dark:text-white line-clamp-1">${u.baslik}</h4>
                                    <p class="text-[11px] text-gray-500 dark:text-gray-400 font-mono mt-0.5">OEM: <strong class="text-gray-800 dark:text-gray-200">${u.oem}</strong></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                                <a href="https://wa.me/905327249417?text=${waMsg}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white font-extrabold px-3 py-2 rounded-lg text-xs uppercase flex items-center gap-1.5 transition-colors">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                                </a>
                                <a href="urun.html?id=${u.id}" class="bg-yellow-500 hover:bg-yellow-600 text-black font-extrabold px-3 py-2 rounded-lg text-xs uppercase flex items-center gap-1.5 transition-colors">
                                    İncele <i class="fa-solid fa-arrow-right text-[10px]"></i>
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                listeKutusu.innerHTML = `
                    <div class="text-center py-10">
                        <i class="fa-solid fa-box-open text-4xl text-gray-400 mb-3"></i>
                        <p class="text-sm font-bold text-gray-700 dark:text-gray-300">Aradığınız kriterlere uygun parça bulunamadı.</p>
                        <p class="text-xs text-gray-500 mt-1">Parça numarasını veya ismini kontrol edip tekrar deneyebilirsiniz.</p>
                        <a href="https://wa.me/905327249417?text=Merhaba,%20${encodeURIComponent(hamGirdi)}%20par%C3%A7as%C4%B1%20stokta%20var%20m%C4%B1?" target="_blank" class="inline-flex items-center gap-2 mt-4 bg-green-600 text-white font-bold px-4 py-2 rounded-lg text-xs uppercase">
                            <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp'tan Özel Sorgula
                        </a>
                    </div>
                `;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function aramaModalKapat() {
            const modal = document.getElementById('arama-liste-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
