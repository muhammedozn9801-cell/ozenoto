<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özen Oto | Depo Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white p-4 font-sans">
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- SOL: ÜRÜN EKLE / DÜZENLE FORMU -->
        <div class="bg-gray-800 rounded-md p-6 shadow-2xl border-t-4 border-yellow-500 h-fit">
            <div class="flex items-center justify-between mb-6 border-b border-gray-700 pb-3">
                <h2 id="form-baslik" class="text-xl font-black uppercase text-yellow-500">
                    <i class="fa-solid fa-plus-circle mr-2"></i>Yeni Ürün Ekle
                </h2>
                <button onclick="formuSifirla()" class="text-xs bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">Sıfırla / Yeni Ekle</button>
            </div>

            <input type="hidden" id="adm-id" value="">

            <div class="space-y-4 text-sm font-bold text-gray-200">
                <div>
                    <label class="block mb-1 text-gray-400">Ürün Adı:</label>
                    <input type="text" id="adm-baslik" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded text-white font-normal">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1 text-gray-400">Araç:</label>
                        <select id="adm-arac" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded font-normal">
                            <option>Renault Megane 4</option><option>Renault Megane 3</option><option>Renault Clio 5</option>
                            <option>Renault Clio 4</option><option>Renault Symbol</option><option>Dacia Duster</option>
                            <option>Dacia Sandero</option><option>Renault / Dacia Genel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1 text-gray-400">Marka:</label>
                        <input type="text" id="adm-marka" value="MAİS" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded font-normal">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1 text-gray-400">OEM Kodu:</label>
                        <input type="text" id="adm-oem" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded font-normal">
                    </div>
                    <div>
                        <label class="block mb-1 text-gray-400">Stok:</label>
                        <select id="adm-stok" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded font-normal">
                            <option>Stokta Var</option><option>Sınırlı Stok</option><option>Tükendi</option>
                        </select>
                    </div>
                </div>
                
                <!-- YENİ GARANTİLİ RESİM YÖNTEMİ -->
                <div class="bg-gray-700 p-3 rounded border border-gray-600">
                    <label class="block mb-2 text-yellow-400 font-black"><i class="fa-solid fa-image mr-1"></i> Resim Ekleme (İki Yöntemden Birini Seç)</label>
                    
                    <label class="block text-[11px] text-gray-400 mb-1">Yöntem 1: İnternetten Kopyaladığın Resim Linkini Yapıştır (Garantili)</label>
                    <input type="text" id="adm-resim-link" placeholder="Örn: https://site.com/resim.jpg" class="w-full p-2 mb-3 bg-gray-800 border border-gray-600 rounded font-normal text-xs">
                    
                    <div class="text-center text-xs text-gray-500 mb-2">- VEYA -</div>

                    <label class="block text-[11px] text-gray-400 mb-1">Yöntem 2: Bilgisayardan Seç (Kendi ImgBB kodunu girdiysen çalışır)</label>
                    <input type="file" id="adm-kamera" accept="image/*" multiple class="w-full p-2 bg-gray-800 rounded font-normal text-xs">
                </div>

                <div>
                    <label class="block mb-1 text-gray-400">Açıklama:</label>
                    <textarea id="adm-aciklama" rows="2" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded font-normal"></textarea>
                </div>
                <button id="adm-btn" onclick="urunKaydet()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3 uppercase rounded shadow-lg">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Siteye Gönder
                </button>
            </div>
        </div>

        <!-- SAĞ: MEVCUT ÜRÜNLERİ DÜZENLEME LİSTESİ -->
        <div class="bg-gray-800 rounded-md p-6 shadow-2xl border-t-4 border-blue-500 h-[650px] flex flex-col">
            <h2 class="text-xl font-black uppercase text-blue-400 mb-4 border-b border-gray-700 pb-3">
                <i class="fa-solid fa-list mr-2"></i>Mevcut Ürünler (Düzenle)
            </h2>
            <div id="urun-listesi" class="overflow-y-auto pr-2 space-y-2 flex-1">
                <p class="text-sm text-gray-400">Ürünler yükleniyor...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. BURAYA GOOGLE SCRIPT LINKINI YAPIŞTIR
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxBd74g4kDl8WDPEeQVQJSKVbiSGoeB1h_jNYfaQWfn63J4OqNelRM0-YuAV4inFqzB_A/exec'; 
        
        // 2. BURAYA KENDİ ALDIĞIN IMGBB API KODUNU YAPIŞTIR (Dosya seçeceksen şart!)
        const IMGBB_API_KEY = 'BURAYA_KENDI_API_KODUNU_YAZ'; 
        
        const SHEET_READ_URL = 'https://docs.google.com/spreadsheets/d/1-iTxWmrBoBRHnsm1gklHB33EBIBG6PdiArKrwYxfG7s/export?format=csv&t=' + new Date().getTime();
        
        let aktifUrunler = [];
        let seciliDosyalar = [];

        window.onload = tablodanCek;

        document.getElementById('adm-kamera').addEventListener('change', (e) => { seciliDosyalar = e.target.files; });

        function tablodanCek() {
            fetch(SHEET_READ_URL).then(res => res.text()).then(text => {
                const satirlar = text.split('\n').slice(1);
                aktifUrunler = satirlar.filter(s => s.trim() !== '').map((s) => {
                    const col = s.split(',');
                    return { id: col[0], baslik: col[1], arac: col[2], oem: col[3], resim: col[4], etiket: col[5], aciklama: col[6] };
                });
                listeyiCiz();
            });
        }

        function listeyiCiz() {
            const liste = document.getElementById('urun-listesi');
            liste.innerHTML = aktifUrunler.reverse().map(u => `
                <div class="bg-gray-700 p-3 rounded flex justify-between items-center cursor-pointer hover:bg-gray-600 border border-gray-600" onclick="duzenleModu('${u.id}')">
                    <div class="truncate pr-4">
                        <div class="text-sm font-bold text-white truncate">${u.baslik}</div>
                        <div class="text-[10px] text-gray-400">${u.arac} | OEM: ${u.oem}</div>
                    </div>
                    <button class="bg-blue-500 text-white px-3 py-1 rounded text-xs"><i class="fa-solid fa-pen"></i></button>
                </div>
            `).join('');
        }

        function duzenleModu(id) {
            const urun = aktifUrunler.find(u => u.id === id);
            if (!urun) return;
            document.getElementById('adm-id').value = urun.id;
            document.getElementById('adm-baslik').value = urun.baslik;
            document.getElementById('adm-arac').value = urun.arac;
            document.getElementById('adm-oem').value = urun.oem;
            document.getElementById('adm-resim-link').value = '';
            
            const etiketParcala = urun.etiket ? urun.etiket.split(' ') : [];
            document.getElementById('adm-marka').value = etiketParcala.length > 1 ? etiketParcala[1] : 'MAİS';
            
            const aciklamaParcala = urun.aciklama ? urun.aciklama.split(' | ') : [];
            if (aciklamaParcala.length > 1) {
                document.getElementById('adm-stok').value = aciklamaParcala[0];
                document.getElementById('adm-aciklama').value = aciklamaParcala.slice(1).join(' | ');
            } else {
                document.getElementById('adm-aciklama').value = urun.aciklama;
            }

            document.getElementById('form-baslik').innerHTML = `<i class="fa-solid fa-pen-to-square mr-2"></i> Düzenleniyor: ${urun.baslik.substring(0,15)}...`;
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function formuSifirla() {
            document.getElementById('adm-id').value = '';
            document.getElementById('adm-baslik').value = '';
            document.getElementById('adm-oem').value = '';
            document.getElementById('adm-aciklama').value = '';
            document.getElementById('adm-kamera').value = '';
            document.getElementById('adm-resim-link').value = '';
            seciliDosyalar = [];
            document.getElementById('form-baslik').innerHTML = `<i class="fa-solid fa-plus-circle mr-2"></i> Yeni Ürün Ekle`;
        }

        async function imgbbYukle(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64Image = reader.result.split(',')[1];
                    const formData = new FormData();
                    formData.append("image", base64Image);
                    try {
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                        const data = await res.json();
                        resolve(data.data.url); 
                    } catch (e) { resolve(""); }
                };
            });
        }

        async function urunKaydet() {
            const btn = document.getElementById('adm-btn');
            const id = document.getElementById('adm-id').value;
            const baslik = document.getElementById('adm-baslik').value.trim();
            const oem = document.getElementById('adm-oem').value.trim();
            const hazirLink = document.getElementById('adm-resim-link').value.trim();
            
            if (!baslik || !oem) return alert('Ürün Adı ve OEM zorunludur!');

            btn.innerText = "Fotoğraflar İşleniyor... Lütfen Bekleyin";
            btn.disabled = true;

            let linkler = [];
            
            // Eğer elle link yapıştırdıysa, direkt onu al
            if(hazirLink !== "") {
                linkler.push(hazirLink);
            } 
            // Eğer bilgisayardan dosya seçtiyse, ImgBB'ye yükle
            else if (seciliDosyalar.length > 0) {
                if(IMGBB_API_KEY === 'BURAYA_KENDI_API_KODUNU_YAZ' || !IMGBB_API_KEY) {
                    alert("Uyarı: ImgBB API kodunuzu girmediniz! Lütfen kodda 84. satıra API kodunuzu ekleyin veya Yöntem 1'i (Resim linki yapıştırmayı) kullanın.");
                    btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-2"></i> Siteye Gönder';
                    btn.disabled = false;
                    return;
                }
                for (let i = 0; i < seciliDosyalar.length; i++) {
                    const url = await imgbbYukle(seciliDosyalar[i]);
                    if (url) linkler.push(url);
                }
            }
            
            btn.innerText = "Tabloya Kaydediliyor...";

            const payload = {
                action: id ? "update" : "add",
                id: id || "PRC-" + Date.now().toString(),
                baslik: baslik,
                arac: document.getElementById('adm-arac').value,
                oem: oem,
                resimler: linkler.length > 0 ? linkler.join('|') : "", // Eğer boşsa script eski resmi veya dukkan.png koyacak
                etiket: "Orijinal " + document.getElementById('adm-marka').value,
                aciklama: document.getElementById('adm-stok').value + " | " + document.getElementById('adm-aciklama').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            }).then(() => {
                alert(id ? 'Ürün Başarıyla Güncellendi!' : 'Yeni Ürün Başarıyla Eklendi!');
                formuSifirla();
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-2"></i> Siteye Gönder';
                btn.disabled = false;
                tablodanCek(); 
            });
        }
    </script>
</body>
</html>
