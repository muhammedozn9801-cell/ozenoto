<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özen Oto - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="urunler.js?v=8.0"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { yellow: '#FFB800', dark: '#121212', cardDark: '#1E1E1E' } } } }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen p-4 antialiased">

    <!-- ŞİFRE EKRANI -->
    <div id="sifre-ekrani" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="bg-brand-cardDark border border-gray-800 w-full max-w-sm p-6 rounded-2xl text-center space-y-4">
            <h2 class="text-lg font-black uppercase text-white">Yönetici Girişi</h2>
            <input type="password" id="admin-sifre-girdi" placeholder="Giriş Şifresi..." class="w-full px-4 py-3 rounded-xl border border-gray-700 bg-gray-900 text-center font-bold text-sm text-white">
            <button onclick="sifreKontrolEt()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3 rounded-xl text-xs uppercase">
                Giriş Yap
            </button>
        </div>
    </div>

    <!-- PANELLER -->
    <div id="admin-icerik" class="max-w-5xl mx-auto space-y-6 hidden">
        
        <div class="flex items-center justify-between bg-brand-cardDark border border-gray-800 p-4 rounded-xl">
            <h1 class="text-base font-black uppercase text-white">Özen Oto Parça Yönetimi</h1>
            <button onclick="paneliSifirla()" class="bg-gray-800 text-gray-300 font-bold px-3 py-2 rounded-lg text-xs">Formu Sıfırla</button>
        </div>

        <!-- 1. ARAMA -->
        <div class="bg-brand-cardDark border border-gray-800 p-4 rounded-xl space-y-2">
            <label class="block text-xs font-black uppercase text-yellow-400">Mevcut Ürünlerde Ara / Düzenle:</label>
            <input type="text" id="admin-arama" oninput="adminUrunAra()" placeholder="Parça adı veya OEM yazın..." class="w-full px-4 py-2.5 rounded-xl border border-gray-700 bg-gray-900 font-bold text-xs text-white">
            <div id="admin-arama-liste" class="hidden max-h-48 overflow-y-auto bg-gray-900 border border-gray-800 rounded-xl"></div>
        </div>

        <!-- 2. FORM -->
        <div class="bg-brand-cardDark border border-gray-800 p-6 rounded-xl space-y-4">
            <h3 id="form-baslik" class="text-xs font-black uppercase text-yellow-400 border-b border-gray-800 pb-2">Ürün Bilgileri</h3>
            <input type="hidden" id="p-id">

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 text-xs">
                <div>
                    <label class="block font-bold text-gray-400 mb-1">Parça Başlığı:</label>
                    <input type="text" id="p-baslik" placeholder="Örn: Viraj Orta Lastiği" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white font-bold">
                </div>

                <div>
                    <label class="block font-bold text-gray-400 mb-1">Marka / Üretici (Elle Yazın):</label>
                    <input type="text" id="p-marka" placeholder="Örn: LUK, MAİS, Valeo, Bosch" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white font-bold">
                </div>

                <div>
                    <label class="block font-bold text-gray-400 mb-1">OEM Parça Kodu:</label>
                    <input type="text" id="p-oem" placeholder="Örn: 8200123456" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white font-mono font-bold uppercase">
                </div>

                <div>
                    <label class="block font-bold text-gray-400 mb-1">Uyumlu Araç Modeli:</label>
                    <select id="p-arac" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white font-bold">
                        <option value="Renault Megane 4 / Kadjar">Renault Megane 4 / Kadjar</option>
                        <option value="Renault Megane 3 / Fluence">Renault Megane 3 / Fluence</option>
                        <option value="Renault Megane 2 / Scenic">Renault Megane 2 / Scenic</option>
                        <option value="Renault Clio 5 / Captur">Renault Clio 5 / Captur</option>
                        <option value="Renault Clio 4 / Captur">Renault Clio 4 / Captur</option>
                        <option value="Dacia Duster (Tüm Kasalar)">Dacia Duster (Tüm Kasalar)</option>
                        <option value="Dacia Sandero / Stepway">Dacia Sandero / Stepway</option>
                        <option value="Tüm Renault & Dacia Modelleri">Tüm Renault & Dacia Modelleri</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-gray-400 mb-1">Stok Durumu:</label>
                    <select id="p-stok" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white font-bold">
                        <option value="var">🟢 Stokta Var</option>
                        <option value="sinirli">🟡 Sınırlı Stok</option>
                        <option value="tukendi">🔴 Sipariş Üzerine / Tükendi</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-gray-400 mb-1">Kategori:</label>
                    <select id="p-kategori" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white font-bold">
                        <option value="motor">Motor</option>
                        <option value="fren">Fren</option>
                        <option value="bakim">Filtre & Bakım</option>
                        <option value="yag">Motor Yağı</option>
                    </select>
                </div>

                <div>
                    <label class="block font-bold text-gray-400 mb-1">Görsel Adı (gorseller/ Klasöründe):</label>
                    <input type="text" id="p-resim" placeholder="Örn: viraj_lastigi.jpg" class="w-full px-3 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white font-bold">
                </div>
            </div>

            <div class="pt-2 flex gap-2">
                <button onclick="urunKaydet()" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-black font-black py-3 rounded-xl text-xs uppercase">
                    Ürünü Kaydet / Güncelle
                </button>
                <button id="btn-sil" onclick="urunSil()" class="hidden bg-red-600 hover:bg-red-700 text-white font-black px-4 py-3 rounded-xl text-xs uppercase">
                    Sil
                </button>
            </div>
        </div>

        <!-- 3. KOD -->
        <div class="bg-brand-cardDark border border-gray-800 p-4 rounded-xl space-y-2">
            <h3 class="text-xs font-black uppercase text-yellow-400">Güncellenmiş urunler.js Kodu</h3>
            <textarea id="kod-çıktısı" readonly class="w-full h-32 bg-gray-950 border border-gray-800 rounded-lg p-2 font-mono text-[10px] text-green-400 select-all"></textarea>
            <button onclick="koduKopyala()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-2.5 rounded-lg text-xs uppercase">
                Kodu Kopyala
            </button>
        </div>
    </div>

    <script>
        let yerelUrunler = [...(window.urunler || [])];

        function sifreKontrolEt() {
            if (document.getElementById('admin-sifre-girdi').value === 'ozen2026') {
                document.getElementById('sifre-ekrani').classList.add('hidden');
                document.getElementById('admin-icerik').classList.remove('hidden');
                kodUret();
            } else alert("Hatalı şifre!");
        }

        function adminUrunAra() {
            const girdi = document.getElementById('admin-arama').value.toLowerCase().trim();
            const liste = document.getElementById('admin-arama-liste');
            if (!girdi) { liste.classList.add('hidden'); return; }

            const eslesenler = yerelUrunler.filter(u => u.baslik.toLowerCase().includes(girdi) || u.oem.toLowerCase().includes(girdi));
            if (eslesenler.length > 0) {
                liste.innerHTML = eslesenler.map(u => `
                    <div onclick="urunFormaYukle('${u.id}')" class="p-2 border-b border-gray-800 hover:bg-yellow-500/10 cursor-pointer flex justify-between text-xs">
                        <strong class="text-white">${u.baslik}</strong>
                        <span class="text-yellow-500">Düzenle</span>
                    </div>
                `).join('');
                liste.classList.remove('hidden');
            } else liste.classList.add('hidden');
        }

        function urunFormaYukle(id) {
            const u = yerelUrunler.find(item => item.id === id);
            if (!u) return;

            document.getElementById('p-id').value = u.id;
            document.getElementById('p-baslik').value = u.baslik;
            document.getElementById('p-marka').value = u.marka || u.etiket || '';
            document.getElementById('p-oem').value = u.oem;
            document.getElementById('p-arac').value = u.arac || 'Renault Megane 4 / Kadjar';
            document.getElementById('p-stok').value = u.stok || 'var';
            document.getElementById('p-kategori').value = u.kategori || 'motor';
            document.getElementById('p-resim').value = u.resim || '';

            document.getElementById('form-baslik').innerText = "Ürün Düzenleme Modu";
            document.getElementById('btn-sil').classList.remove('hidden');
            document.getElementById('admin-arama-liste').classList.add('hidden');
        }

        function urunKaydet() {
            const id = document.getElementById('p-id').value || 'u_' + Date.now();
            const baslik = document.getElementById('p-baslik').value.trim();
            const marka = document.getElementById('p-marka').value.trim() || 'MAİS';
            const oem = document.getElementById('p-oem').value.trim().toUpperCase();
            const arac = document.getElementById('p-arac').value;
            const stok = document.getElementById('p-stok').value;
            const kategori = document.getElementById('p-kategori').value;
            const resim = document.getElementById('p-resim').value.trim();

            if (!baslik || !oem) { alert("Başlık ve OEM alanları zorunludur."); return; }

            const varOlanIndex = yerelUrunler.findIndex(item => item.id === id);
            const yeniObje = { id, baslik, oem, arac, kategori, etiket: marka, marka, stok, resim };

            if (varOlanIndex > -1) yerelUrunler[varOlanIndex] = yeniObje;
            else yerelUrunler.push(yeniObje);

            kodUret(); paneliSifirla();
            alert("Ürün kaydedildi! Kodu kopyalayıp urunler.js dosyasına yapıştırın.");
        }

        function urunSil() {
            const id = document.getElementById('p-id').value;
            if (id && confirm("Silmek istiyor musunuz?")) {
                yerelUrunler = yerelUrunler.filter(item => item.id !== id);
                kodUret(); paneliSifirla();
            }
        }

        function paneliSifirla() {
            document.getElementById('p-id').value = '';
            document.getElementById('p-baslik').value = '';
            document.getElementById('p-marka').value = '';
            document.getElementById('p-oem').value = '';
            document.getElementById('p-resim').value = '';
            document.getElementById('admin-arama').value = '';
            document.getElementById('btn-sil').classList.add('hidden');
        }

        function kodUret() {
            document.getElementById('kod-çıktısı').value = `window.urunler = ${JSON.stringify(yerelUrunler, null, 4)};`;
        }

        function koduKopyala() {
            const txt = document.getElementById('kod-çıktısı');
            txt.select();
            navigator.clipboard.writeText(txt.value);
            alert("Kopyalandı! urunler.js dosyasına yapıştırabilirsiniz.");
        }
    </script>
</body>
</html>
